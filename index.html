<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NCB TEST — Chat AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0f1a;
    --panel: #131824;
    --panel-2: #1a2033;
    --accent: #4f8cff;
    --accent-2: #a855f7;
    --text: #e8ecf4;
    --muted: #8892a8;
    --user: #1e2a48;
    --bot: #161c2b;
    --border: #232a3d;
  }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1a2244, var(--bg));
    color: var(--text);
    display: flex; justify-content: center;
    padding: 12px; height: 100vh; overflow: hidden;
  }
  .app {
    width: 100%; max-width: 900px; height: 100%;
    display: flex; flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  header {
    padding: 14px 18px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(90deg, rgba(79,140,255,.10), rgba(168,85,247,.10));
  }
  .logo {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    font-weight: 800; font-size: 13px; color: #fff; flex-shrink: 0;
  }
  .brand { flex: 1; min-width: 0; }
  .brand h1 { font-size: 16px; font-weight: 700; }
  .brand p { font-size: 11.5px; color: var(--muted); }
  .tools { display: flex; gap: 8px; }
  .tools button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 11px;
    border-radius: 9px;
    font-size: 12.5px;
    cursor: pointer;
    transition: background .15s;
  }
  .tools button:hover { background: #252c42; }

  #chat {
    flex: 1; overflow-y: auto; padding: 18px;
    display: flex; flex-direction: column; gap: 12px;
    scroll-behavior: smooth;
  }
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: #2a3248; border-radius: 8px; }

  .msg {
    max-width: 85%;
    padding: 11px 14px;
    border-radius: 14px;
    line-height: 1.55;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: fade .18s ease-out;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  .msg.user {
    align-self: flex-end;
    background: var(--user);
    border: 1px solid #2e3d66;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.bot code {
    background: #0a0e16; padding: 2px 6px; border-radius: 5px;
    font-family: ui-monospace, Menlo, monospace; font-size: 13px;
    color: #a5d6ff;
  }
  .msg.bot pre {
    background: #0a0e16; padding: 12px; border-radius: 9px;
    overflow-x: auto; margin: 8px 0; border: 1px solid var(--border);
  }
  .msg.bot pre code { background: none; padding: 0; }

  .typing { display: flex; gap: 4px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,60%,100%{opacity:.3;} 30%{opacity:1;} }

  footer {
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    background: var(--panel-2);
    display: flex; gap: 8px; align-items: flex-end;
  }
  #input {
    flex: 1; resize: none;
    min-height: 46px; max-height: 150px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid #2b3348;
    background: var(--bg);
    color: var(--text);
    font-family: inherit; font-size: 14.5px;
    outline: none;
    transition: border-color .15s;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    padding: 0 18px;
    height: 46px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-weight: 700; font-size: 14px;
    cursor: pointer;
    transition: filter .15s, transform .1s;
    flex-shrink: 0;
  }
  #send:hover:not(:disabled) { filter: brightness(1.12); }
  #send:active:not(:disabled) { transform: scale(.97); }
  #send:disabled { opacity: .45; cursor: not-allowed; }

  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    display: none; place-items: center;
    padding: 16px; z-index: 100;
  }
  .modal.open { display: grid; }
  .modal-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    max-width: 440px; width: 100%;
  }
  .modal-box h2 { font-size: 16px; margin-bottom: 14px; }
  .modal-box label {
    display: block;
    font-size: 12.5px; color: var(--muted);
    margin: 12px 0 6px;
  }
  .modal-box input, .modal-box select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #2b3348;
    background: var(--bg);
    color: var(--text);
    font-family: inherit; font-size: 14px;
    outline: none;
  }
  .modal-box input:focus, .modal-box select:focus { border-color: var(--accent); }
  .modal-box .hint {
    font-size: 11.5px; color: var(--muted);
    margin-top: 8px; line-height: 1.5;
  }
  .modal-box .hint a { color: var(--accent); }
  .modal-box .actions {
    margin-top: 18px;
    display: flex; gap: 10px; justify-content: flex-end;
  }
  .modal-box .actions button {
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13.5px; font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
  }
  .modal-box .actions button.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; color: #fff;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">NCB</div>
    <div class="brand">
      <h1>NCB TEST</h1>
      <p id="model-label">Pollinations · openai/gpt-5.4-nano</p>
    </div>
    <div class="tools">
      <button id="btn-settings" title="Cài đặt">⚙</button>
      <button id="btn-clear" title="Xóa chat">🗑</button>
    </div>
  </header>

  <main id="chat"></main>

  <footer>
    <textarea id="input" rows="1" placeholder="Nhập tin nhắn… (Enter gửi, Shift+Enter xuống dòng)"></textarea>
    <button id="send">Gửi</button>
  </footer>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2>Cài đặt</h2>
    <label>API Key (<code>sk_...</code>)</label>
    <input id="cfg-key" type="password" placeholder="sk_..." autocomplete="off" />
    <div class="hint">
      Lấy <strong>Secret Key</strong> tại
      <a href="https://enter.pollinations.ai/keys" target="_blank" rel="noopener">
        enter.pollinations.ai/keys
      </a>
      → <em>Create Key</em> (không phải Create App Key).<br>
      Key chỉ lưu trong <code>localStorage</code> trình duyệt của bạn.
    </div>

    <label>Model</label>
    <select id="cfg-model"></select>

    <label>System prompt</label>
    <input id="cfg-system" type="text" />

    <div class="actions">
      <button id="btn-cancel">Hủy</button>
      <button id="btn-save" class="primary">Lưu</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   NCB TEST — Pollinations chat client
   Endpoint : POST https://gen.pollinations.ai/v1/chat/completions
   Auth     : Bearer sk_...
   ========================================================= */

const ENDPOINT = "https://gen.pollinations.ai/v1/chat/completions";

const MODELS = [
  { id: "openai/gpt-5.4-nano",          label: "OpenAI GPT-5.4 Nano" },
  { id: "openai/gpt-4o-mini",           label: "OpenAI GPT-4o Mini" },
  { id: "openai/gpt-5-nano",            label: "OpenAI GPT-5 Nano" },
  { id: "anthropic/claude-haiku-4.5",   label: "Claude Haiku 4.5" },
  { id: "anthropic/claude-sonnet-4.6",  label: "Claude Sonnet 4.6" },
  { id: "google/gemini-2.5-flash-lite", label: "Gemini 2.5 Flash Lite" },
  { id: "google/gemini-3.7-flash",      label: "Gemini 3.7 Flash" },
  { id: "deepseek/deepseek-v4-flash",   label: "DeepSeek V4 Flash" },
  { id: "qwen/qwen3.7-plus",            label: "Qwen 3.7 Plus" },
  { id: "meta/llama-3.3-70b-instruct",  label: "Llama 3.3 70B" },
  { id: "mistralai/mistral-small-3.2",  label: "Mistral Small 3.2" },
  { id: "x-ai/grok-4.20",               label: "Grok 4.20" },
];

const DEFAULT_SYSTEM = "Bạn là NCB TEST, trợ lý AI thân thiện, trả lời bằng tiếng Việt, ngắn gọn và chính xác. Dùng markdown khi cần thiết.";
const MAX_HISTORY = 20;

const state = {
  apiKey:  localStorage.getItem("ncb.key")    || "",
  model:   localStorage.getItem("ncb.model")  || MODELS[0].id,
  system:  localStorage.getItem("ncb.system") || DEFAULT_SYSTEM,
  history: JSON.parse(localStorage.getItem("ncb.history") || "[]"),
  busy: false,
};

const chatEl     = document.getElementById("chat");
const inputEl    = document.getElementById("input");
const sendEl     = document.getElementById("send");
const modelLabel = document.getElementById("model-label");
const modal      = document.getElementById("modal");
const cfgKey     = document.getElementById("cfg-key");
const cfgModel   = document.getElementById("cfg-model");
const cfgSystem  = document.getElementById("cfg-system");

MODELS.forEach(m => {
  const o = document.createElement("option");
  o.value = m.id;
  o.textContent = m.label + " — " + m.id;
  cfgModel.appendChild(o);
});

function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function renderMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, _l, c) =>
    `<pre><code>${c.replace(/\n$/,"")}</code></pre>`);
  html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  return html;
}
function updateModelLabel() {
  modelLabel.textContent = "Pollinations · " + state.model;
}
function saveState() {
  localStorage.setItem("ncb.key", state.apiKey);
  localStorage.setItem("ncb.model", state.model);
  localStorage.setItem("ncb.system", state.system);
  localStorage.setItem("ncb.history", JSON.stringify(state.history.slice(-50)));
}
function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

function addBubble(role, text, streaming = false) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = streaming ? "" :
    (role === "bot" ? renderMarkdown(text) : escapeHtml(text));
  chatEl.appendChild(div);
  scrollBottom();
  return div;
}
function showTyping() {
  const d = document.createElement("div");
  d.className = "msg bot typing";
  d.id = "typing-ind";
  d.innerHTML = "<span></span><span></span><span></span>";
  chatEl.appendChild(d);
  scrollBottom();
}
function hideTyping() { document.getElementById("typing-ind")?.remove(); }
function setBusy(v) {
  state.busy = v;
  sendEl.disabled = v;
  inputEl.disabled = v;
}

function renderHistory() {
  chatEl.innerHTML = "";
  if (state.history.length === 0) {
    addBubble("bot",
      "Xin chào 👋 Mình là **NCB TEST**.\n\n" +
      "• Bấm **⚙** để nhập API key và chọn model.\n" +
      "• Lấy key tại enter.pollinations.ai/keys."
    );
    return;
  }
  state.history.forEach(m => addBubble(m.role === "user" ? "user" : "bot", m.content));
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || state.busy) return;

  if (!state.apiKey || !state.apiKey.startsWith("sk_")) {
    addBubble("bot",
      "⚠️ Chưa có API key hợp lệ.\n" +
      "Bấm **⚙** để nhập **Secret Key** (`sk_...`) — lưu ý **không** dùng App Key (`pk_...`)."
    );
    return;
  }

  inputEl.value = "";
  inputEl.style.height = "auto";
  state.history.push({ role: "user", content: text });
  addBubble("user", text);
  saveState();

  setBusy(true);
  showTyping();

  try {
    await streamReply();
  } catch (err) {
    hideTyping();
    addBubble("bot", "❌ Lỗi: " + err.message);
  } finally {
    setBusy(false);
    inputEl.focus();
  }
}

async function streamReply() {
  const messages = [
    { role: "system", content: state.system },
    ...state.history.slice(-MAX_HISTORY).map(m => ({
      role: m.role === "user" ? "user" : "assistant",
      content: m.content,
    })),
  ];

  const res = await fetch(ENDPOINT, {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + state.apiKey,
      "Content-Type": "application/json",
    },
    body: JSON.stringify({
      model: state.model,
      messages,
      stream: true,
      temperature: 0.7,
    }),
  });

  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try {
      const j = await res.json();
      msg = j?.error?.message || msg;
    } catch {}
    if (res.status === 401) msg += " — kiểm tra key (phải là sk_..., không phải pk_...)";
    if (res.status === 402) msg += " — hết budget, nạp credit hoặc dùng model free";
    throw new Error(msg);
  }

  hideTyping();
  const botEl = addBubble("bot", "", true);
  let acc = "";

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    let idx;
    while ((idx = buffer.indexOf("\n\n")) !== -1) {
      const chunk = buffer.slice(0, idx);
      buffer = buffer.slice(idx + 2);
      for (const line of chunk.split("\n")) {
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (!data || data === "[DONE]") continue;
        try {
          const json = JSON.parse(data);
          const delta = json?.choices?.[0]?.delta?.content;
          if (delta) {
            acc += delta;
            botEl.innerHTML = renderMarkdown(acc);
            scrollBottom();
          }
        } catch (_) {}
      }
    }
  }

  if (!acc) {
    botEl.innerHTML = "_(không có phản hồi)_";
    state.history.push({ role: "assistant", content: "(không có phản hồi)" });
  } else {
    state.history.push({ role: "assistant", content: acc });
  }
  saveState();
}

sendEl.addEventListener("click", send);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + "px";
});

document.getElementById("btn-clear").addEventListener("click", () => {
  if (!confirm("Xóa toàn bộ lịch sử chat?")) return;
  state.history = [];
  saveState();
  renderHistory();
});
document.getElementById("btn-settings").addEventListener("click", () => {
  cfgKey.value    = state.apiKey;
  cfgModel.value  = state.model;
  cfgSystem.value = state.system;
  modal.classList.add("open");
});
document.getElementById("btn-cancel").addEventListener("click", () => {
  modal.classList.remove("open");
});
document.getElementById("btn-save").addEventListener("click", () => {
  state.apiKey = cfgKey.value.trim();
  state.model  = cfgModel.value;
  state.system = cfgSystem.value.trim() || DEFAULT_SYSTEM;
  saveState();
  updateModelLabel();
  modal.classList.remove("open");
});

updateModelLabel();
renderHistory();
if (!state.apiKey) {
  setTimeout(() => {
    cfgKey.value    = state.apiKey;
    cfgModel.value  = state.model;
    cfgSystem.value = state.system;
    modal.classList.add("open");
  }, 400);
}
inputEl.focus();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NCB TEST — Đăng nhập Pollinations</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1a2244, #0b0f1a);
    color: #e8ecf4; min-height: 100vh;
    display: grid; place-items: center; padding: 20px;
  }
  .card {
    background: #131824; border: 1px solid #232a3d;
    border-radius: 18px; padding: 32px;
    max-width: 460px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p.sub { color: #8892a8; font-size: 13px; margin-bottom: 22px; line-height: 1.5; }
  .logo {
    width: 48px; height: 48px; border-radius: 12px;
    background: linear-gradient(135deg, #4f8cff, #a855f7);
    display: grid; place-items: center;
    font-weight: 800; font-size: 14px; color: #fff; margin-bottom: 18px;
  }
  button {
    width: 100%; padding: 13px;
    border: none; border-radius: 11px;
    background: linear-gradient(135deg, #4f8cff, #a855f7);
    color: #fff; font-weight: 700; font-size: 14.5px;
    cursor: pointer; margin-bottom: 10px;
    transition: filter .15s, transform .1s;
  }
  button:hover:not(:disabled) { filter: brightness(1.12); }
  button:active:not(:disabled) { transform: scale(.98); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost {
    background: #1a2033; border: 1px solid #232a3d;
    font-weight: 600; font-size: 13.5px;
  }
  .box {
    background: #0b0f1a; border: 1px solid #232a3d;
    border-radius: 11px; padding: 14px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12.5px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-all;
    margin-top: 14px; min-height: 44px;
    color: #8892a8;
  }
  .box.ok   { border-color: #2e7d32; color: #a5e8a8; }
  .box.err  { border-color: #c62828; color: #ffb4b4; }
  .box code { color: #a5d6ff; }
  .code-big {
    font-size: 28px; letter-spacing: 6px;
    text-align: center; padding: 18px 0;
    font-weight: 800; color: #fff;
  }
  .row { display: flex; gap: 10px; }
  .row button { flex: 1; }
  a { color: #4f8cff; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">NCB</div>
  <h1>NCB TEST — Đăng nhập</h1>
  <p class="sub">
    Đăng nhập qua <strong>Pollinations Pay (BYOP)</strong> để nhận
    token <code>sk_</code> tạm thời có budget giới hạn.
  </p>

  <button id="btn-login">Đăng nhập với Pollinations</button>
  <div class="row">
    <button id="btn-device" class="ghost">Device Flow (không cần redirect)</button>
    <button id="btn-logout" class="ghost">Đăng xuất</button>
  </div>

  <div class="box" id="status">Chưa đăng nhập.</div>
</div>

<script>
/* =====================================================================
   CẤU HÌNH
   ===================================================================== */
const APP_KEY = "pk_QreHuFoUJaVVZvua";          // App Key (publishable)
const REDIRECT_URI = location.origin + location.pathname; // phải khớp khai báo App
const SCOPES = "text";                          // quyền model: "text", "image,text", ...
                                                // hoặc model ID cụ thể
const BUDGET_USD = 5;                           // hạn mức cho mỗi consent (USD)
const EXPIRY_DAYS = 7;                          // key sống bao nhiêu ngày

/* Endpoint OAuth — XÁC MINH LẠI từ BRING_YOUR_OWN_POLLEN.md */
const AUTH_URL   = "https://enter.pollinations.ai/oauth/authorize";
const TOKEN_URL  = "https://enter.pollinations.ai/oauth/token";
const DEVICE_URL = "https://enter.pollinations.ai/oauth/device_authorization";

/* Storage key */
const LS_TOKEN   = "ncb.oauth.token";
const LS_EXPIRES = "ncb.oauth.expires";
const LS_VERIFIER = "ncb.oauth.verifier";

/* =====================================================================
   TIỆN ÍCH PKCE
   ===================================================================== */
function b64url(bytes) {
  let s = btoa(String.fromCharCode(...bytes));
  return s.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function randomString(len = 64) {
  const b = new Uint8Array(len);
  crypto.getRandomValues(b);
  return b64url(b).slice(0, len);
}
async function sha256Challenge(verifier) {
  const buf = await crypto.subtle.digest("SHA-256",
    new TextEncoder().encode(verifier));
  return b64url(new Uint8Array(buf));
}

/* =====================================================================
   UI HELPERS
   ===================================================================== */
const statusEl = document.getElementById("status");
function setStatus(text, cls = "") {
  statusEl.className = "box " + cls;
  statusEl.textContent = text;
}

/* =====================================================================
   TOKEN STORAGE
   ===================================================================== */
function saveToken(token, expiresAtMs) {
  sessionStorage.setItem(LS_TOKEN, token);
  sessionStorage.setItem(LS_EXPIRES, String(expiresAtMs));
}
function loadToken() {
  const t = sessionStorage.getItem(LS_TOKEN);
  const exp = Number(sessionStorage.getItem(LS_EXPIRES) || 0);
  if (!t) return null;
  if (exp && Date.now() > exp) { logout(); return null; }
  return t;
}
function logout() {
  sessionStorage.removeItem(LS_TOKEN);
  sessionStorage.removeItem(LS_EXPIRES);
  sessionStorage.removeItem(LS_VERIFIER);
  setStatus("Đã đăng xuất.");
  showLoggedOut();
}
function showLoggedIn(token) {
  const masked = token.slice(0, 10) + "…" + token.slice(-4);
  setStatus("✅ Đã đăng nhập.\nToken: " + masked, "ok");
  document.getElementById("btn-login").disabled = true;
  document.getElementById("btn-device").disabled = true;
}
function showLoggedOut() {
  document.getElementById("btn-login").disabled = false;
  document.getElementById("btn-device").disabled = false;
}

/* =====================================================================
   FLOW 1 — AUTH CODE + PKCE
   ===================================================================== */
async function startAuthCodeFlow() {
  const verifier = randomString(64);
  sessionStorage.setItem(LS_VERIFIER, verifier);
  const challenge = await sha256Challenge(verifier);
  const st = randomString(24);
  sessionStorage.setItem("ncb.oauth.state", st);

  const params = new URLSearchParams({
    client_id: APP_KEY,
    redirect_uri: REDIRECT_URI,
    response_type: "code",
    scope: SCOPES,
    state: st,
    code_challenge: challenge,
    code_challenge_method: "S256",
    budget: String(BUDGET_USD),
    expiry_days: String(EXPIRY_DAYS),
  });
  location.href = AUTH_URL + "?" + params.toString();
}

async function handleAuthCallback() {
  const q = new URLSearchParams(location.search);
  const code = q.get("code");
  const err  = q.get("error");
  const st   = q.get("state");

  if (err) {
    setStatus("❌ OAuth lỗi: " + err + "\n" + (q.get("error_description") || ""), "err");
    history.replaceState(null, "", location.pathname);
    return;
  }
  if (!code) return; // không phải callback

  history.replaceState(null, "", location.pathname); // xóa ?code khỏi URL

  const verifier = sessionStorage.getItem(LS_VERIFIER);
  const savedState = sessionStorage.getItem("ncb.oauth.state");
  if (!verifier) { setStatus("❌ Thiếu code_verifier — bắt đầu lại.", "err"); return; }
  if (st !== savedState) { setStatus("❌ state không khớp — có thể bị CSRF.", "err"); return; }

  setStatus("Đang đổi code → token…");
  try {
    const res = await fetch(TOKEN_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        grant_type: "authorization_code",
        client_id: APP_KEY,
        code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier,
      }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status + ": " + await res.text());
    const data = await res.json();

    const token = data.access_token;
    const expiresIn = data.expires_in || (EXPIRY_DAYS * 86400);
    if (!token || !token.startsWith("sk_"))
      throw new Error("Server không trả về access_token sk_…");

    saveToken(token, Date.now() + expiresIn * 1000);
    sessionStorage.removeItem(LS_VERIFIER);
    sessionStorage.removeItem("ncb.oauth.state");

    showLoggedIn(token);
  } catch (e) {
    setStatus("❌ Đổi token thất bại: " + e.message, "err");
  }
}

/* =====================================================================
   FLOW 2 — DEVICE FLOW
   ===================================================================== */
async function startDeviceFlow() {
  setStatus("Đang yêu cầu device code…");
  try {
    const res = await fetch(DEVICE_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        client_id: APP_KEY,
        scope: SCOPES,
      }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status + ": " + await res.text());
    const dev = await res.json();

    const { device_code, user_code, verification_uri, verification_uri_complete,
            interval = 5, expires_in = 300 } = dev;

    setStatus(
      `Mở: ${verification_uri || verification_uri_complete}\n` +
      `Nhập mã: ${user_code}\n\n` +
      `Đang chờ bạn xác nhận…`
    );
    // hiển thị mã to cho dễ nhìn
    const big = document.createElement("div");
    big.className = "code-big";
    big.textContent = user_code;
    statusEl.appendChild(big);

    const deadline = Date.now() + expires_in * 1000;
    while (Date.now() < deadline) {
      await new Promise(r => setTimeout(r, interval * 1000));
      const tr = await fetch(TOKEN_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          grant_type: "urn:ietf:params:oauth:grant-type:device_code",
          client_id: APP_KEY,
          device_code,
        }),
      });
      const td = await tr.json();
      if (tr.ok && td.access_token) {
        const expiresIn = td.expires_in || EXPIRY_DAYS * 86400;
        saveToken(td.access_token, Date.now() + expiresIn * 1000);
        showLoggedIn(td.access_token);
        return;
      }
      if (td.error === "authorization_pending") continue;
      if (td.error === "slow_down") { interval += 2; continue; }
      if (td.error === "access_denied") throw new Error("Bạn đã từ chối.");
      if (td.error === "expired_token") throw new Error("Mã đã hết hạn.");
      throw new Error(td.error_description || td.error || "Lỗi device flow");
    }
    throw new Error("Hết thời gian chờ xác nhận.");
  } catch (e) {
    setStatus("❌ Device flow lỗi: " + e.message, "err");
  }
}

/* =====================================================================
   TEST GỌI API BẰNG TOKEN sk_
   ===================================================================== */
async function testCall() {
  const token = loadToken();
  if (!token) return;
  const box = document.createElement("div");
  box.className = "box";
  box.textContent = "Đang test gọi API…";
  statusEl.appendChild(box);

  try {
    const r = await fetch("https://gen.pollinations.ai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        model: "openai/gpt-5.4-nano",
        messages: [{ role: "user", content: "Chào, trả lời 1 câu." }],
      }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error("HTTP " + r.status + ": " + JSON.stringify(j));
    box.className = "box ok";
    box.textContent = "✅ API OK:\n" + j.choices[0].message.content;
  } catch (e) {
    box.className = "box err";
    box.textContent = "❌ " + e.message;
  }
}

/* =====================================================================
   WIRE UP
   ===================================================================== */
document.getElementById("btn-login").addEventListener("click", startAuthCodeFlow);
document.getElementById("btn-device").addEventListener("click", startDeviceFlow);
document.getElementById("btn-logout").addEventListener("click", logout);

(async function boot() {
  await handleAuthCallback();        // xử lý callback nếu URL có ?code=
  const t = loadToken();
  if (t) { showLoggedIn(t); testCall(); }
  else { showLoggedOut(); setStatus("Chưa đăng nhập."); }
})();
</script>
</body>
</html>

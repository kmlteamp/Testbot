ơ<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NCB TEST — Chat AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-2: #1f2330;
    --accent: #4f8cff;
    --accent-2: #7c5cff;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --user: #2a3550;
    --bot: #1f2330;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2340, var(--bg));
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  .app {
    width: 100%;
    max-width: 880px;
    height: calc(100vh - 32px);
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid #262b3a;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  header {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #262b3a;
    background: linear-gradient(90deg, rgba(79,140,255,.12), rgba(124,92,255,.12));
  }
  .logo {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    font-weight: 800; font-size: 14px; color: #fff;
  }
  header h1 { font-size: 17px; font-weight: 700; letter-spacing: .3px; }
  header p { font-size: 12px; color: var(--muted); }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .msg {
    max-width: 82%;
    padding: 12px 15px;
    border-radius: 14px;
    line-height: 1.55;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: pop .18s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px);} to {opacity:1; transform:none;} }
  .msg.user {
    align-self: flex-end;
    background: var(--user);
    border: 1px solid #37466b;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot);
    border: 1px solid #2b3142;
    border-bottom-left-radius: 4px;
  }
  .msg.bot code {
    background: #0e1118; padding: 2px 6px; border-radius: 5px;
    font-family: ui-monospace, Menlo, monospace; font-size: 13px;
  }
  .msg.bot pre {
    background: #0e1118; padding: 12px; border-radius: 10px;
    overflow-x: auto; margin: 8px 0; border: 1px solid #262b3a;
  }
  .msg.bot pre code { background: none; padding: 0; }
  .typing { display: flex; gap: 4px; padding: 14px 16px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2){ animation-delay: .2s; }
  .typing span:nth-child(3){ animation-delay: .4s; }
  @keyframes blink { 0%,60%,100%{opacity:.25;} 30%{opacity:1;} }
  footer {
    padding: 14px 16px;
    border-top: 1px solid #262b3a;
    display: flex;
    gap: 10px;
    background: var(--panel-2);
  }
  #input {
    flex: 1;
    resize: none;
    max-height: 140px;
    min-height: 46px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid #2f3648;
    background: #0f1117;
    color: var(--text);
    font-family: inherit;
    font-size: 14.5px;
    outline: none;
    transition: border-color .15s;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    padding: 0 20px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: filter .15s, transform .1s;
  }
  #send:hover:not(:disabled) { filter: brightness(1.12); }
  #send:active:not(:disabled) { transform: scale(.97); }
  #send:disabled { opacity: .45; cursor: not-allowed; }
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: #2c3244; border-radius: 8px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">NCB</div>
    <div>
      <h1>NCB TEST</h1>
      <p>Trợ lý AI · OpenRouter</p>
    </div>
  </header>

  <main id="chat"></main>

  <footer>
    <textarea id="input" rows="1" placeholder="Nhập tin nhắn… (Enter để gửi, Shift+Enter xuống dòng)"></textarea>
    <button id="send">Gửi</button>
  </footer>
</div>

<script>
/* =========================================================
   CẤU HÌNH
   ---------------------------------------------------------
   ⚠️ CẢNH BÁO: Key đặt ở đây sẽ LỘ với mọi người truy cập
   trang web. Chỉ dùng khi chạy LOCAL / TEST nội bộ.
   Khi deploy công khai → bắt buộc dùng backend proxy.
   ========================================================= */
const CONFIG = {
  API_KEY: "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", // <-- thay bằng key CỦA BẠN (đừng commit lên Git)
  MODEL: "openai/gpt-4o-mini",                // đổi model tùy ý, vd: "meta-llama/llama-3.1-8b-instruct:free"
  ENDPOINT: "https://openrouter.ai/api/v1/chat/completions",
  SYSTEM_PROMPT: "Bạn là NCB TEST, trợ lý AI thân thiện, trả lời bằng tiếng Việt, ngắn gọn và chính xác.",
  MAX_HISTORY: 20 // số tin nhắn gần nhất gửi kèm để giữ ngữ cảnh
};

/* ---------------- DOM ---------------- */
const chatEl  = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendEl  = document.getElementById("send");

/* ---------------- STATE ---------------- */
/** @type {{role:"user"|"assistant", content:string}[]} */
let history = [];
let sending = false;

/* ---------------- HELPERS ---------------- */
function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/** Render markdown tối giản: code block, inline code, in đậm, xuống dòng */
function renderMarkdown(text) {
  let html = escapeHtml(text);

  // code block ```lang ... ```
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
    `<pre><code>${code.replace(/\n$/,"")}</code></pre>`
  );
  // inline code
  html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  // bold
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  return html;
}

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.innerHTML = role === "bot" ? renderMarkdown(text) : escapeHtml(text);
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "msg bot typing";
  div.innerHTML = "<span></span><span></span><span></span>";
  div.id = "typing-indicator";
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function hideTyping() {
  document.getElementById("typing-indicator")?.remove();
}

function setSending(v) {
  sending = v;
  sendEl.disabled = v;
  inputEl.disabled = v;
}

/* ---------------- API CALL ---------------- */
async function callAI(userText) {
  // Ghép lịch sử (giới hạn) + tin nhắn mới
  history.push({ role: "user", content: userText });
  const trimmed = history.slice(-CONFIG.MAX_HISTORY);

  const payload = {
    model: CONFIG.MODEL,
    messages: [
      { role: "system", content: CONFIG.SYSTEM_PROMPT },
      ...trimmed
    ],
    temperature: 0.7
  };

  const res = await fetch(CONFIG.ENDPOINT, {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${CONFIG.API_KEY}`,
      "Content-Type": "application/json",
      "HTTP-Referer": location.origin,   // OpenRouter yêu cầu để xếp hạng
      "X-Title": "NCB TEST"
    },
    body: JSON.stringify(payload)
  });

  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`HTTP ${res.status}: ${errText}`);
  }

  const data = await res.json();
  const reply = data?.choices?.[0]?.message?.content?.trim() || "(Không có phản hồi)";
  history.push({ role: "assistant", content: reply });
  return reply;
}

/* ---------------- HANDLERS ---------------- */
async function handleSend() {
  const text = inputEl.value.trim();
  if (!text || sending) return;

  if (!CONFIG.API_KEY || CONFIG.API_KEY.startsWith("DÁN_")) {
    addMessage("bot", "⚠️ Chưa cấu hình API_KEY trong CONFIG. Mở file và dán key OpenRouter của bạn.");
    return;
  }

  inputEl.value = "";
  inputEl.style.height = "auto";
  addMessage("user", text);

  setSending(true);
  showTyping();

  try {
    const reply = await callAI(text);
    hideTyping();
    addMessage("bot", reply);
  } catch (err) {
    hideTyping();
    addMessage("bot", `❌ Lỗi: ${err.message}`);
  } finally {
    setSending(false);
    inputEl.focus();
  }
}

sendEl.addEventListener("click", handleSend);

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

// Auto-resize textarea
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
});

/* ---------------- WELCOME ---------------- */
addMessage("bot",
  "Xin chào 👋 Mình là **NCB TEST**.\nHãy nhập câu hỏi bên dưới để bắt đầu."
);
inputEl.focus();
</script>
</body>
</html>

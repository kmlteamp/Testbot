<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NCB TEST — Chat AI + Semantic Memory</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0f1a;
    --panel: #131824;
    --panel-2: #1a2033;
    --accent: #4f8cff;
    --accent-2: #a855f7;
    --text: #e8ecf4;
    --muted: #8892a8;
    --user: #1e2a48;
    --bot: #161c2b;
    --border: #232a3d;
  }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1a2244, var(--bg));
    color: var(--text);
    display: flex; justify-content: center;
    padding: 12px; height: 100vh; overflow: hidden;
  }
  .app {
    width: 100%; max-width: 900px; height: 100%;
    display: flex; flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  header {
    padding: 14px 18px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(90deg, rgba(79,140,255,.10), rgba(168,85,247,.10));
  }
  .logo {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    font-weight: 800; font-size: 13px; color: #fff; flex-shrink: 0;
  }
  .brand { flex: 1; min-width: 0; }
  .brand h1 { font-size: 16px; font-weight: 700; }
  .brand p { font-size: 11.5px; color: var(--muted); }
  .tools { display: flex; gap: 8px; }
  .tools button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 11px;
    border-radius: 9px;
    font-size: 12.5px;
    cursor: pointer;
    transition: background .15s;
  }
  .tools button:hover { background: #252c42; }

  #chat {
    flex: 1; overflow-y: auto; padding: 18px;
    display: flex; flex-direction: column; gap: 12px;
    scroll-behavior: smooth;
  }
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: #2a3248; border-radius: 8px; }

  .msg {
    max-width: 85%;
    padding: 11px 14px;
    border-radius: 14px;
    line-height: 1.55;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: fade .18s ease-out;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  .msg.user {
    align-self: flex-end;
    background: var(--user);
    border: 1px solid #2e3d66;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.bot code {
    background: #0a0e16; padding: 2px 6px; border-radius: 5px;
    font-family: ui-monospace, Menlo, monospace; font-size: 13px;
    color: #a5d6ff;
  }
  .msg.bot pre {
    background: #0a0e16; padding: 12px; border-radius: 9px;
    overflow-x: auto; margin: 8px 0; border: 1px solid var(--border);
  }
  .msg.bot pre code { background: none; padding: 0; }

  .memory-badge {
    display: inline-block;
    font-size: 10.5px;
    color: var(--muted);
    background: rgba(79,140,255,.12);
    border: 1px solid rgba(79,140,255,.25);
    padding: 2px 8px;
    border-radius: 6px;
    margin-bottom: 6px;
  }

  .typing { display: flex; gap: 4px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,60%,100%{opacity:.3;} 30%{opacity:1;} }

  footer {
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    background: var(--panel-2);
    display: flex; gap: 8px; align-items: flex-end;
  }
  #input {
    flex: 1; resize: none;
    min-height: 46px; max-height: 150px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid #2b3348;
    background: var(--bg);
    color: var(--text);
    font-family: inherit; font-size: 14.5px;
    outline: none;
    transition: border-color .15s;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    padding: 0 18px;
    height: 46px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-weight: 700; font-size: 14px;
    cursor: pointer;
    transition: filter .15s, transform .1s;
    flex-shrink: 0;
  }
  #send:hover:not(:disabled) { filter: brightness(1.12); }
  #send:active:not(:disabled) { transform: scale(.97); }
  #send:disabled { opacity: .45; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">NCB</div>
    <div class="brand">
      <h1>NCB TEST</h1>
      <p id="model-label">openai/gpt-5.4-nano · semantic memory</p>
    </div>
    <div class="tools">
      <button id="btn-clear" title="Xóa chat + memory">🗑</button>
    </div>
  </header>

  <main id="chat"></main>

  <footer>
    <textarea id="input" rows="1" placeholder="Nhập tin nhắn… (Enter gửi, Shift+Enter xuống dòng)"></textarea>
    <button id="send">Gửi</button>
  </footer>
</div>

<script>
/* =========================================================
   NCB TEST — Frontend với Semantic Memory (Voyage embeddings)
   Backend proxy: /api/embed và /api/chat
   ========================================================= */

const MODEL = "openai/gpt-5.4-nano";
const EMBED_MODEL = "voyage-4-large";
const MAX_HISTORY = 20;
const TOP_K_MEMORY = 3;
const SYSTEM_PROMPT = "Bạn là NCB TEST, trợ lý AI thân thiện, trả lời bằng tiếng Việt, ngắn gọn và chính xác. Bạn có bộ nhớ dài hạn về các cuộc hội thoại trước đó; hãy dùng thông tin liên quan nếu được cung cấp.";

/* ---------- STATE ---------- */
const state = {
  history: JSON.parse(localStorage.getItem("ncb.history") || "[]"),
  memory: JSON.parse(localStorage.getItem("ncb.memory") || "[]"), // [{ text, role, embedding }]
  busy: false,
};

/* ---------- DOM ---------- */
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendEl = document.getElementById("send");
const modelLabel = document.getElementById("model-label");

/* ---------- TIỆN ÍCH ---------- */
function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function renderMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, _l, c) =>
    `<pre><code>${c.replace(/\n$/,"")}</code></pre>`);
  html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  return html;
}
function saveState() {
  localStorage.setItem("ncb.history", JSON.stringify(state.history.slice(-100)));
  localStorage.setItem("ncb.memory", JSON.stringify(state.memory.slice(-200)));
}
function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

function addBubble(role, text, extra = "") {
  const div = document.createElement("div");
  div.className = "msg " + role;
  const content = role === "bot" ? renderMarkdown(text) : escapeHtml(text);
  div.innerHTML = extra + content;
  chatEl.appendChild(div);
  scrollBottom();
  return div;
}

function showTyping() {
  const d = document.createElement("div");
  d.className = "msg bot typing";
  d.id = "typing-ind";
  d.innerHTML = "<span></span><span></span><span></span>";
  chatEl.appendChild(d);
  scrollBottom();
}
function hideTyping() { document.getElementById("typing-ind")?.remove(); }

function setBusy(v) {
  state.busy = v;
  sendEl.disabled = v;
  inputEl.disabled = v;
}

/* ---------- EMBEDDING ---------- */
async function getEmbedding(text, inputType = "document") {
  const res = await fetch("/api/embed", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ input: text, model: EMBED_MODEL, input_type: inputType }),
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error("Embedding thất bại: " + err);
  }
  const data = await res.json();
  // MongoDB/Voyage trả về { data: [{ embedding: [...] }, ...] }
  const vec = data?.data?.[0]?.embedding;
  if (!vec || !Array.isArray(vec)) throw new Error("Không nhận được vector embedding");
  return vec;
}

/* ---------- SIMILARITY ---------- */
function cosineSimilarity(a, b) {
  if (a.length !== b.length) return 0;
  let dot = 0, magA = 0, magB = 0;
  for (let i = 0; i < a.length; i++) {
    dot += a[i] * b[i];
    magA += a[i] * a[i];
    magB += b[i] * b[i];
  }
  const denom = Math.sqrt(magA) * Math.sqrt(magB);
  return denom === 0 ? 0 : dot / denom;
}

/* ---------- RETRIEVE MEMORY ---------- */
async function retrieveRelevantMemory(queryText, topK = TOP_K_MEMORY) {
  if (state.memory.length === 0) return [];
  const qVec = await getEmbedding(queryText, "query");

  const scored = state.memory
    .map((m) => ({ ...m, score: cosineSimilarity(qVec, m.embedding) }))
    .filter((m) => m.score > 0.35) // ngưỡng tương đồng tối thiểu
    .sort((a, b) => b.score - a.score)
    .slice(0, topK);

  return scored;
}

/* ---------- LƯU MEMORY ---------- */
async function storeMemory(text, role) {
  try {
    const vec = await getEmbedding(text, "document");
    state.memory.push({ text, role, embedding: vec, ts: Date.now() });
    saveState();
  } catch (e) {
    console.warn("Không lưu được memory:", e.message);
  }
}

/* ---------- GỬI TIN NHẮN ---------- */
async function send() {
  const text = inputEl.value.trim();
  if (!text || state.busy) return;

  inputEl.value = "";
  inputEl.style.height = "auto";
  state.history.push({ role: "user", content: text });
  addBubble("user", text);
  saveState();

  setBusy(true);
  showTyping();

  try {
    // 1. Truy xuất memory liên quan
    let memoryContext = "";
    try {
      const relevant = await retrieveRelevantMemory(text);
      if (relevant.length > 0) {
        memoryContext =
          "\n\n[NGỮ CẢNH TỪ BỘ NHỚ]\n" +
          relevant
            .map((m) => `- ${m.role === "user" ? "Người dùng" : "Trợ lý"}: ${m.text}`)
            .join("\n");
      }
    } catch (e) {
      console.warn("Retrieve memory lỗi:", e.message);
    }

    // 2. Gọi chat với streaming
    const messages = [
      { role: "system", content: SYSTEM_PROMPT + memoryContext },
      ...state.history.slice(-MAX_HISTORY).map((m) => ({
        role: m.role === "user" ? "user" : "assistant",
        content: m.content,
      })),
    ];

    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: MODEL, messages, stream: true, temperature: 0.7 }),
    });

    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      try { const j = await res.json(); msg = j?.error?.message || msg; } catch {}
      throw new Error(msg);
    }

    hideTyping();
    const botEl = addBubble("bot", "", `<div class="memory-badge">🧠 Đã dùng ${memoryContext ? "bộ nhớ" : "ngữ cảnh trực tiếp"}</div>`);
    let acc = "";

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buffer.indexOf("\n\n")) !== -1) {
        const chunk = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        for (const line of chunk.split("\n")) {
          if (!line.startsWith("data:")) continue;
          const data = line.slice(5).trim();
          if (!data || data === "[DONE]") continue;
          try {
            const json = JSON.parse(data);
            const delta = json?.choices?.[0]?.delta?.content;
            if (delta) {
              acc += delta;
              botEl.innerHTML = `<div class="memory-badge">🧠 ${memoryContext ? "Đã dùng bộ nhớ" : "Ngữ cảnh trực tiếp"}</div>` + renderMarkdown(acc);
              scrollBottom();
            }
          } catch (_) {}
        }
      }
    }

    const finalReply = acc || "(không có phản hồi)";
    state.history.push({ role: "assistant", content: finalReply });
    saveState();

    // 3. Lưu cả câu hỏi và câu trả lời vào memory
    await storeMemory(text, "user");
    await storeMemory(finalReply, "assistant");
  } catch (err) {
    hideTyping();
    addBubble("bot", "❌ Lỗi: " + err.message);
  } finally {
    setBusy(false);
    inputEl.focus();
  }
}

/* ---------- RENDER HISTORY ---------- */
function renderHistory() {
  chatEl.innerHTML = "";
  if (state.history.length === 0) {
    addBubble("bot",
      "Xin chào 👋 Mình là **NCB TEST**, có **bộ nhớ ngữ nghĩa** dùng MongoDB AI.\n\n" +
      "• Hãy chat bình thường — mình sẽ tự nhớ các ý chính.\n" +
      "• Khi bạn hỏi lại chủ đề cũ, mình sẽ truy xuất ký ức liên quan."
    );
    return;
  }
  state.history.forEach((m) => addBubble(m.role === "user" ? "user" : "bot", m.content));
}

/* ---------- SỰ KIỆN ---------- */
sendEl.addEventListener("click", send);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + "px";
});

document.getElementById("btn-clear").addEventListener("click", () => {
  if (!confirm("Xóa toàn bộ lịch sử chat và bộ nhớ?")) return;
  state.history = [];
  state.memory = [];
  saveState();
  renderHistory();
});

/* ---------- KHỞI ĐỘNG ---------- */
modelLabel.textContent = MODEL + " · " + EMBED_MODEL;
renderHistory();

// Kiểm tra backend
fetch("/api/health").then(r => r.json()).then(h => {
  if (!h.mongodb) console.warn("MongoDB AI key chưa cấu hình — memory sẽ không hoạt động.");
  if (!h.pollinations) console.warn("Pollinations key chưa cấu hình — chat sẽ không hoạt động.");
}).catch(() => {});

inputEl.focus();
</script>
</body>
</html>
